<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PapelIA — Diagnóstico de Processo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --graphite: #14181B;
    --panel: #1B2124;
    --panel-line: #2B3338;
    --paper: #E7E2D3;
    --paper-dim: #9CA3A1;
    --kraft: #B08858;
    --steel: #4A87A6;
    --alert: #C0392B;
    --ok: #6E9B6B;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background: var(--graphite);
    color: var(--paper);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }

  header{
    display:flex;
    align-items:center;
    gap:14px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--panel-line);
    flex-shrink:0;
  }
  header svg{ width:34px; height:34px; flex-shrink:0; }
  header .title{ display:flex; flex-direction:column; line-height:1.25; }
  header .title strong{ font-size:16px; font-weight:600; letter-spacing:0.2px; }
  header .title span{ font-size:12.5px; color: var(--paper-dim); }
  header .status{
    margin-left:auto;
    display:flex; align-items:center; gap:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color: var(--paper-dim);
  }
  header .dot{ width:7px; height:7px; border-radius:50%; background: var(--ok); }
  header .dot.off{ background: var(--alert); }
  header button#resetBtn{
    margin-left:16px;
    background:none;
    border:1px solid var(--panel-line);
    color: var(--paper-dim);
    padding:6px 12px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size:12.5px;
    border-radius:3px;
    cursor:pointer;
  }
  header button#resetBtn:hover{ border-color: var(--kraft); color: var(--paper); }

  main{
    flex:1;
    overflow-y:auto;
    padding: 28px 0 8px 0;
  }
  .feed{
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px 24px 24px;
    display:flex;
    flex-direction:column;
    gap: 22px;
  }

  .msg{ display:flex; flex-direction:column; gap:5px; max-width: 92%; }
  .msg.user{ align-self:flex-end; align-items:flex-end; }
  .msg.assistant{ align-self:flex-start; align-items:flex-start; }

  .msg .who{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color: var(--paper-dim);
    letter-spacing: 0.3px;
  }

  .msg .bubble{
    padding: 12px 16px;
    font-size: 14.5px;
    line-height:1.55;
    white-space: pre-wrap;
    border-left: 2px solid transparent;
  }
  .msg.user .bubble{
    background: rgba(74,135,166,0.08);
    border-left-color: var(--steel);
    color: var(--paper);
  }
  .msg.assistant .bubble{
    background: rgba(176,136,88,0.06);
    border-left-color: var(--kraft);
    color: var(--paper);
  }

  .typing{
    display:flex; gap:4px; padding: 4px 0 0 2px;
  }
  .typing span{
    width:5px; height:5px; border-radius:50%;
    background: var(--kraft);
    opacity:0.4;
    animation: blink 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay:0.18s; }
  .typing span:nth-child(3){ animation-delay:0.36s; }
  @keyframes blink{ 0%,80%,100%{opacity:0.25;} 40%{opacity:0.9;} }

  footer{
    border-top: 1px solid var(--panel-line);
    padding: 16px 24px 20px 24px;
    flex-shrink:0;
  }
  .inputRow{
    max-width: 720px;
    margin: 0 auto;
    display:flex;
    gap:10px;
    align-items:flex-end;
  }
  textarea#msgInput{
    flex:1;
    resize:none;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    color: var(--paper);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14.5px;
    padding: 12px 14px;
    border-radius:3px;
    line-height:1.4;
    max-height: 140px;
  }
  textarea#msgInput:focus{ outline:none; border-color: var(--kraft); }
  textarea#msgInput::placeholder{ color: var(--paper-dim); }

  button#sendBtn{
    background: var(--kraft);
    color: var(--graphite);
    border:none;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:14px;
    padding: 12px 20px;
    border-radius:3px;
    cursor:pointer;
    flex-shrink:0;
  }
  button#sendBtn:disabled{ background: var(--panel-line); color: var(--paper-dim); cursor:default; }
  button#sendBtn:not(:disabled):hover{ background:#c39968; }

  .hint{
    max-width:720px; margin: 8px auto 0 auto;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; color: var(--paper-dim);
  }
</style>
</head>
<body>

<header>
  <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="4" y="10" width="32" height="20" rx="1" stroke="#B08858" stroke-width="1.4"/>
    <path d="M4 16 H36" stroke="#4A87A6" stroke-width="1.4"/>
    <path d="M4 24 H36" stroke="#4A87A6" stroke-width="1.4"/>
    <circle cx="11" cy="20" r="1.6" fill="#B08858"/>
    <circle cx="20" cy="20" r="1.6" fill="#B08858"/>
    <circle cx="29" cy="20" r="1.6" fill="#B08858"/>
  </svg>
  <div class="title">
    <strong>PapelIA</strong>
    <span>Diagnóstico de processo de fabricação de papel</span>
  </div>
  <div class="status">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">verificando API...</span>
  </div>
  <button id="resetBtn">Novo diagnóstico</button>
</header>

<main>
  <div class="feed" id="feed"></div>
</main>

<footer>
  <div class="inputRow">
    <textarea id="msgInput" rows="1" placeholder="Descreva o problema (ex.: papel saindo com Cobb alto no lado tela)..."></textarea>
    <button id="sendBtn">Enviar</button>
  </div>
  <div class="hint" id="sessionHint"></div>
</footer>

<script>
  // ---- Configuração ----
  const API_BASE = "http://127.0.0.1:8000"; // troque se o backend rodar em outro host/porta

  // ---- Sessão (cada aba/navegador mantém sua própria conversa) ----
  let sessionId = localStorage.getItem("papelia_session_id");
  if (!sessionId) {
    sessionId = crypto.randomUUID();
    localStorage.setItem("papelia_session_id", sessionId);
  }
  document.getElementById("sessionHint").textContent = "sessão: " + sessionId.slice(0, 8);

  const feed = document.getElementById("feed");
  const input = document.getElementById("msgInput");
  const sendBtn = document.getElementById("sendBtn");
  const resetBtn = document.getElementById("resetBtn");
  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");

  function addMessage(role, text) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + role;
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = role === "user" ? "você" : "papelia";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    wrap.appendChild(who);
    wrap.appendChild(bubble);
    feed.appendChild(wrap);
    scrollToBottom();
    return bubble;
  }

  function addTyping() {
    const wrap = document.createElement("div");
    wrap.className = "msg assistant";
    wrap.id = "typingIndicator";
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = "papelia";
    const dots = document.createElement("div");
    dots.className = "typing";
    dots.innerHTML = "<span></span><span></span><span></span>";
    wrap.appendChild(who);
    wrap.appendChild(dots);
    feed.appendChild(wrap);
    scrollToBottom();
  }

  function removeTyping() {
    const el = document.getElementById("typingIndicator");
    if (el) el.remove();
  }

  function scrollToBottom() {
    const main = document.querySelector("main");
    main.scrollTop = main.scrollHeight;
  }

  async function checkHealth() {
    try {
      const res = await fetch(API_BASE + "/health");
      if (res.ok) {
        statusDot.classList.remove("off");
        statusText.textContent = "api conectada";
      } else {
        throw new Error();
      }
    } catch {
      statusDot.classList.add("off");
      statusText.textContent = "api offline";
    }
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addMessage("user", text);
    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;
    addTyping();

    try {
      const res = await fetch(API_BASE + "/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Session-Id": sessionId
        },
        body: JSON.stringify({ mensagem: text })
      });
      const data = await res.json();
      removeTyping();

      if (data.erro) {
        addMessage("assistant", "Erro ao consultar o modelo: " + data.erro);
      } else {
        addMessage("assistant", data.resposta);
      }
    } catch (err) {
      removeTyping();
      addMessage("assistant", "Não consegui falar com a API em " + API_BASE + ". Ela está rodando? (uvicorn main:app --reload)");
    } finally {
      sendBtn.disabled = false;
      checkHealth();
    }
  }

  resetBtn.addEventListener("click", async () => {
    try {
      await fetch(API_BASE + "/reset", {
        method: "POST",
        headers: { "X-Session-Id": sessionId }
      });
    } catch {}
    feed.innerHTML = "";
    addMessage("assistant", "Histórico limpo. Descreva o novo problema de processo.");
  });

  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });

  checkHealth();
  addMessage("assistant", "Olá. Sou o PapelIA. Descreva o problema que você está vendo na máquina ou no laboratório, e eu vou fazer algumas perguntas antes do diagnóstico.");
</script>

</body>
</html>
